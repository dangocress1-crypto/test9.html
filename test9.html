                    <div class="bg-[#0b132b] text-slate-200 rounded-xl p-3 text-[13px] inline-flex items-start gap-2 border border-blue-900 shadow-inner">

                            สามารถสแกนได้เลย

                    </div>
                </div>

                <!-- ส่วนเลขบัญชีและปุ่มคัดลอก -->

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 animate-bounce text-blue-400">

    <script>
        function copyText(text, buttonElement) {
            // สร้าง textarea ซ่อนไว้เพื่อคัดลอกข้อความ (รองรับ iframe และ mobile)
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                // ทำการคัดลอก
                document.execCommand('copy');
                
                // แสดง Popup แจ้งเตือนน่ารักๆ
                showToast();

                // เปลี่ยนสไตล์ปุ่มชั่วคราวให้รู้ว่ากดแล้ว
                const originalHtml = buttonElement.innerHTML;
                const originalClass = buttonElement.className;
                
                buttonElement.innerHTML = '✔ คัดลอกแล้ว';
                buttonElement.classList.add('opacity-70', 'scale-95');
                
                setTimeout(() => {
                    buttonElement.innerHTML = originalHtml;
                    buttonElement.className = originalClass;
                }, 2000);

            } catch (err) {
                console.error('ไม่สามารถคัดลอกได้:', err);
            }

            // ลบ textarea ทิ้ง
            document.body.removeChild(textArea);
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.remove('opacity-0', '-translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', '-translate-y-4');
            }, 2500);
        }
    </script>
